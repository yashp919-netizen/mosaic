[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosaic"
version = "0.1.0"
description = "Multi-agent AI reference architecture for CPG product master harmonization"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "pydantic>=2.0",
    "instructor>=1.0",
    "faiss-cpu>=1.8",
    "FlagEmbedding>=1.2",
    "ollama>=0.2",
    "google-generativeai>=0.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.35",
    "faker>=25.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 100
