[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosaic"
version = "0.1.0"
description = "Multi-agent AI reference architecture for CPG product master harmonization"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "ollama>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "instructor>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.35",
    "pandas>=2.2",
    "faker>=25.0",
    "langdetect>=1.0",
    "google-cloud-aiplatform>=1.50",
    "google-generativeai>=0.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "google-genai>=1.73.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]
